<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Join Kimbia</title>
  <!-- Bootstrap 5 (styling only — no app bootstrap, this page is standalone/embeddable) -->
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous" />
  <!-- htmx: progressive-enhancement fallback for sites that can't run custom JS -->
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
</head>
<body class="bg-light">
  <div class="container py-5" style="max-width:480px">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h3 class="fw-bold mb-1">Join Kimbia</h3>
        <p class="text-muted small mb-4">
          Create your account — this form works with or without JavaScript.
        </p>

        <div id="register-result">
          {% include "register_embed_result.html" %}
        </div>

        <form id="register-embed-form"
              method="post"
              action="{% url 'register-embed' %}"
              hx-post="{% url 'register-embed' %}"
              hx-target="#register-result"
              hx-swap="innerHTML">
          {% csrf_token %}
          <div class="row g-2 mb-2">
            <div class="col-6">
              <label class="form-label" for="id_first_name">First Name</label>
              <input type="text" class="form-control" id="id_first_name" name="first_name"
                     value="{{ data.first_name|default:'' }}" required />
            </div>
            <div class="col-6">
              <label class="form-label" for="id_last_name">Last Name</label>
              <input type="text" class="form-control" id="id_last_name" name="last_name"
                     value="{{ data.last_name|default:'' }}" required />
            </div>
          </div>
          <div class="mb-2">
            <label class="form-label" for="id_email">Email</label>
            <input type="email" class="form-control" id="id_email" name="email"
                   value="{{ data.email|default:'' }}" required />
          </div>
          <div class="mb-2">
            <label class="form-label" for="id_phone">Phone</label>
            <input type="tel" class="form-control" id="id_phone" name="phone"
                   value="{{ data.phone|default:'' }}" placeholder="+263 77 xxx xxxx" />
          </div>
          <div class="mb-2">
            <label class="form-label" for="id_password">Password</label>
            <input type="password" class="form-control" id="id_password" name="password" required />
          </div>
          <div class="mb-3">
            <label class="form-label" for="id_password_confirm">Confirm Password</label>
            <input type="password" class="form-control" id="id_password_confirm" name="password_confirm" required />
          </div>
          <button type="submit" class="btn btn-warning w-100 fw-bold">Create Account</button>
        </form>
      </div>
    </div>
  </div>
</body>
</html>
